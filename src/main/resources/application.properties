# 1. Prefijo Global para todos los RestControllers
spring.mvc.servlet.path=/api/v1

# 2. Configuración de Conexión JDBC a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/controllabs
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# 3. Configuración de Hibernate ORM
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# 4. Logs SQL en consola para depuración
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true